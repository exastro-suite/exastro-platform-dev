# Conversation API Definitions
# チャット会話とメッセージ管理API

conversation_tags:
  - name: ConversationService
    description: チャット会話・メッセージ管理

conversation_paths:
  /api/{organization_id}/platform/workspaces/{workspace_id}/conversations:
    post:
      tags:
        - ConversationService
      summary: 会話を作成
      description: 新しいチャット会話を作成する
      operationId: create_conversation
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                  description: 会話タイトル
                  example: "Bedrockとのチャット"
      responses:
        '200':
          description: 会話作成成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      conversation_id:
                        type: string
                      title:
                        type: string
                      status:
                        type: string
        '400':
          description: バリデーションエラー
        '500':
          description: サーバーエラー
      x-openapi-router-controller: controllers.conversation_service_controller

    get:
      tags:
        - ConversationService
      summary: 会話一覧を取得
      description: ユーザーの会話一覧を取得する
      operationId: list_conversations
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, closed, archived]
          description: ステータスフィルター
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
          description: 取得件数
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
          description: オフセット
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                  data:
                    type: object
                    properties:
                      conversations:
                        type: array
                        items:
                          $ref: '#/components/schemas/ConversationInfo'
                      count:
                        type: integer
                      total_count:
                        type: integer
      x-openapi-router-controller: controllers.conversation_service_controller

  /api/{organization_id}/platform/workspaces/{workspace_id}/conversations/{conversation_id}/messages:
    get:
      tags:
        - ConversationService
      summary: メッセージ一覧を取得
      description: 会話のメッセージ履歴を取得する
      operationId: list_messages
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
        - name: conversation_id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
          description: 取得件数
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
          description: オフセット（message_seq基準）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                  data:
                    type: object
                    properties:
                      messages:
                        type: array
                        items:
                          $ref: '#/components/schemas/MessageInfo'
                      count:
                        type: integer
                      conversation_id:
                        type: string
        '404':
          description: 会話が見つからない
      x-openapi-router-controller: controllers.conversation_service_controller

    post:
      tags:
        - ConversationService
      summary: メッセージを送信
      description: ユーザーメッセージを送信し、AIから応答を取得する
      operationId: send_message
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
        - name: conversation_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  description: ユーザーメッセージ
                  example: "こんにちは！Bedrockのテストです。"
                model_id:
                  type: string
                  description: 使用するモデルID（省略時はデフォルト）
                  example: "anthropic.claude-3-5-sonnet-20240620-v1:0"
                ai_service_id:
                  type: string
                  description: AIサービスID（省略時は'bedrock'）
                  default: "bedrock"
      responses:
        '200':
          description: メッセージ送信成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      conversation_id:
                        type: string
                      user_message_id:
                        type: string
                      assistant_message_id:
                        type: string
                      content:
                        type: string
                        description: AIの応答
                      usage:
                        type: object
                        properties:
                          input_tokens:
                            type: integer
                          output_tokens:
                            type: integer
                          total_tokens:
                            type: integer
        '400':
          description: バリデーションエラー
        '404':
          description: 会話が見つからない
        '500':
          description: サーバーエラー
      x-openapi-router-controller: controllers.conversation_service_controller

conversation_schemas:
  ConversationInfo:
    type: object
    properties:
      conversation_id:
        type: string
      title:
        type: string
      status:
        type: string
        enum: [active, closed, archived]
      current_token_count:
        type: integer
      message_count:
        type: integer
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time

  MessageInfo:
    type: object
    properties:
      message_id:
        type: string
      conversation_id:
        type: string
      message_seq:
        type: integer
      role:
        type: string
        enum: [user, assistant, system]
      message_text:
        type: string
      ai_service_id:
        type: string
      ai_model_id:
        type: string
      token_count:
        type: integer
      created_at:
        type: string
        format: date-time
