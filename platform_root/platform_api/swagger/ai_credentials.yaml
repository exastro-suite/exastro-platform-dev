# AI Credential API Definitions
# 汎用AIサービスのCredential管理API

ai_credential_tags:
  - name: AiCredentialService
    description: 汎用AIサービスのCredential管理

ai_credential_paths:
  /api/{organization_id}/platform/users/_current/{ai_service_id}/credentials:
    post:
      tags:
        - AiCredentialService
      summary: Credentialを登録
      description: AIサービスのCredentialを登録する
      operationId: register_credential
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
        - name: ai_service_id
          in: path
          required: true
          schema:
            type: string
            enum: [aws-cache, bedrock, openai, anthropic, vertex, azure-openai]
          description: |
            AIサービスID
            - aws-cache: AWS Login Cache (自動トークン更新、credential_data: {"enabled": true})
            - bedrock: AWS Bedrock (手動Credential登録)
            - openai: OpenAI
            - anthropic: Anthropic Claude
            - vertex: Google Vertex AI
            - azure-openai: Azure OpenAI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - credential_name
                - credential_data
              properties:
                credential_name:
                  type: string
                  description: Credential名
                  example: "My Bedrock Credential"
                credential_data:
                  type: object
                  description: |
                    Credentialデータ（JSON形式、サービスごとに異なる）

                    aws-cache の例:
                      {"enabled": true}

                    bedrock の例:
                      {
                        "access_key_id": "ASIA...",
                        "secret_access_key": "...",
                        "session_token": "...",
                        "region": "ap-northeast-1",
                        "expires_at": "2026-08-17T15:00:00Z"
                      }
                  example:
                    enabled: true
                notes:
                  type: string
                  description: 備考
      responses:
        '200':
          description: 登録成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      credential_id:
                        type: string
                      ai_service_id:
                        type: string
                      credential_name:
                        type: string
                      status:
                        type: string
                      message:
                        type: string
        '400':
          description: バリデーションエラー
        '500':
          description: サーバーエラー
      x-openapi-router-controller: controllers.ai_credential_service_controller

    get:
      tags:
        - AiCredentialService
      summary: Credential一覧を取得
      description: ユーザーのCredential一覧を取得する
      operationId: list_credentials
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
        - name: ai_service_id
          in: path
          required: true
          schema:
            type: string
            enum: [aws-cache, bedrock, openai, anthropic, vertex, azure-openai]
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, expired, disabled]
          description: ステータスフィルター
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                  data:
                    type: object
                    properties:
                      credentials:
                        type: array
                        items:
                          $ref: '#/components/schemas/AiCredentialInfo'
                      count:
                        type: integer
                      ai_service_id:
                        type: string
      x-openapi-router-controller: controllers.ai_credential_service_controller

  /api/{organization_id}/platform/users/_current/{ai_service_id}/credentials/{credential_id}:
    get:
      tags:
        - AiCredentialService
      summary: Credential詳細を取得
      description: 特定のCredential詳細を取得する（Credentialデータはマスクされる）
      operationId: get_credential
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
        - name: ai_service_id
          in: path
          required: true
          schema:
            type: string
            enum: [aws-cache, bedrock, openai, anthropic, vertex, azure-openai]
        - name: credential_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                  data:
                    type: object
                    properties:
                      credential_id:
                        type: string
                      ai_service_id:
                        type: string
                      credential_name:
                        type: string
                      status:
                        type: string
                      expires_at:
                        type: string
                        format: date-time
                      last_used_at:
                        type: string
                        format: date-time
                      credential_data_keys:
                        type: array
                        items:
                          type: string
                        description: Credentialデータに含まれるキー一覧
        '404':
          description: Credentialが見つからない
      x-openapi-router-controller: controllers.ai_credential_service_controller

    patch:
      tags:
        - AiCredentialService
      summary: Credentialを更新
      description: 既存のCredentialを部分更新する（指定したフィールドのみ更新）
      operationId: update_credential
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
        - name: ai_service_id
          in: path
          required: true
          schema:
            type: string
            enum: [aws-cache, bedrock, openai, anthropic, vertex, azure-openai]
        - name: credential_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                credential_name:
                  type: string
                  description: Credential名（任意）
                credential_data:
                  type: object
                  description: Credentialデータ（任意）
                notes:
                  type: string
                  description: 備考（任意）
            examples:
              update_cache:
                summary: キャッシュファイルを更新
                value:
                  credential_data:
                    accessToken:
                      accessKeyId: "ASIA..."
                      secretAccessKey: "..."
                      sessionToken: "..."
                      expiresAt: "2026-08-19T12:00:00Z"
                    refreshToken: "..."
                    idToken: "..."
              update_name:
                summary: Credential名だけ更新
                value:
                  credential_name: "新しい名前"
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      credential_id:
                        type: string
                      ai_service_id:
                        type: string
                      credential_name:
                        type: string
                      status:
                        type: string
                      message:
                        type: string
        '400':
          description: バリデーションエラー
        '404':
          description: Credentialが見つからない
      x-openapi-router-controller: controllers.ai_credential_service_controller

    delete:
      tags:
        - AiCredentialService
      summary: Credentialを削除
      description: Credentialを削除する
      operationId: delete_credential
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
        - name: ai_service_id
          in: path
          required: true
          schema:
            type: string
            enum: [aws-cache, bedrock, openai, anthropic, vertex, azure-openai]
        - name: credential_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 削除成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                  data:
                    type: object
                    properties:
                      credential_id:
                        type: string
                      message:
                        type: string
        '404':
          description: Credentialが見つからない
      x-openapi-router-controller: controllers.ai_credential_service_controller

  /api/{organization_id}/platform/users/me/{ai_service_id}/credentials/{credential_id}/validate:
    post:
      tags:
        - AiCredentialService
      summary: Credentialを検証
      description: Credentialが有効かどうかを検証する
      operationId: validate_credential
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
        - name: ai_service_id
          in: path
          required: true
          schema:
            type: string
            enum: [aws-cache, bedrock, openai, anthropic, vertex, azure-openai]
        - name: credential_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 検証結果
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                  data:
                    type: object
                    properties:
                      valid:
                        type: boolean
                      message:
                        type: string
                      account_id:
                        type: string
                        description: AWSアカウントID（Bedrockの場合）
                      user_id:
                        type: string
                        description: AWS User ID（Bedrockの場合）
        '404':
          description: Credentialが見つからない
      x-openapi-router-controller: controllers.ai_credential_service_controller

  /api/{organization_id}/platform/users/_current/{ai_service_id}/models:
    get:
      tags:
        - AiCredentialService
      summary: 使用可能なモデル一覧を取得
      description: 登録されたCredentialを使用して、AIサービスで利用可能なモデル一覧を取得する
      operationId: list_models
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
        - name: ai_service_id
          in: path
          required: true
          schema:
            type: string
            enum: [aws-cache, bedrock]
          description: AIサービスID（現在はaws-cacheとbedrockのみ対応）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                  data:
                    type: object
                    properties:
                      models:
                        type: array
                        items:
                          $ref: '#/ai_credential_schemas/ModelInfo'
                      count:
                        type: integer
                        description: モデル数
                      ai_service_id:
                        type: string
                        description: AIサービスID
        '400':
          description: バリデーションエラー
        '404':
          description: Credentialが見つからない
      x-openapi-router-controller: controllers.ai_credential_service_controller

ai_credential_schemas:
  AiCredentialInfo:
    type: object
    properties:
      credential_id:
        type: string
      ai_service_id:
        type: string
        enum: [aws-cache, bedrock, openai, anthropic, vertex, azure-openai]
      credential_name:
        type: string
      status:
        type: string
        enum: [active, expired, disabled]
      expires_at:
        type: string
        format: date-time
      last_validated_at:
        type: string
        format: date-time
      last_used_at:
        type: string
        format: date-time
      validation_error:
        type: string
      notes:
        type: string
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time

  ModelInfo:
    type: object
    properties:
      id:
        type: string
        description: モデルID
      name:
        type: string
        description: モデル名
      description:
        type: string
        description: モデル説明
      type:
        type: string
        description: プロファイルタイプ
      status:
        type: string
        description: ステータス
