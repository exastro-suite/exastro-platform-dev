WSGISocketPrefix ${APACHE_SOCKET_DIR}/wsgi

# NOTE:
# - 通常系は既存の platform-auth グループを利用
# - 外部API待ちで詰まりやすい OASE Agent events のみ別グループへ分離する
#
# 値(processes/threads)は初期値例です。環境(CPU/メモリ/通常系RPS)に応じて調整してください。
WSGIDaemonProcess platform-auth locale=C.UTF-8 processes=${PLATFORM_AUTH_WSGI_PROCESSES} threads=${PLATFORM_AUTH_WSGI_THREADS} display-name=%{GROUP}

# heavy path 用（同時実行上限を小さくして隔離）
# OASE Receiver の分離
WSGIDaemonProcess platform-auth-oase-receiver locale=C.UTF-8 processes=${OASE_RECEIVER_WSGI_PROCESSES} threads=${OASE_RECEIVER_WSGI_THREADS} display-name=%{GROUP}
WSGIScriptAliasMatch "^(/api/[^/]+/workspaces/[^/]+/oase_agent/.*)$" /app/application.wsgi$1 process-group=platform-auth-oase-receiver

# Ansible Execution Receiver の分離
WSGIDaemonProcess platform-auth-ansible-execution-receiver locale=C.UTF-8 processes=${ANSIBLE_EXECUTION_RECEIVER_WSGI_PROCESSES} threads=${ANSIBLE_EXECUTION_RECEIVER_WSGI_THREADS} display-name=%{GROUP}
WSGIScriptAliasMatch "^(/api/[^/]+/workspaces/[^/]+/ansible_execution_agent/.*)$" /app/application.wsgi$1 process-group=platform-auth-ansible-execution-receiver

WSGIProcessGroup platform-auth
WSGIScriptAlias / /app/application.wsgi process-group=platform-auth
WSGIPassAuthorization On

<Directory /app >
  Require all granted
</Directory>

<Directory /app >
    Require all granted
</Directory>

#
# セキュリティヘッダ - Security headers (Clickjacking / CWE-1021, CWE-693)
#   サーバレベルで定義し、ユーザー用・管理用の両VirtualHostに適用する
#   Defined at server level so that both VirtualHosts inherit them
#   プロキシ先(Keycloak等)が返す同名ヘッダは unset してから付与し、二重送信を防ぐ
#   Headers returned by backends (Keycloak etc.) are unset first to avoid duplicates
#
<IfModule mod_headers.c>
    # Keycloak の login-status-iframe.html / 3p-cookies/ は別オリジンのアプリから埋め込まれる前提のページのため除外し、
    # Keycloak が返すヘッダのままとする
    # Keycloak's login-status-iframe.html and 3p-cookies/ are designed to be framed by other origins, so they are excluded
    <If "%{REQUEST_URI} !~ m#^/auth/realms/[^/]+/protocol/openid-connect/(login-status-iframe\.html|3p-cookies/)#">
        Header unset X-Frame-Options
        Header always set X-Frame-Options "SAMEORIGIN"

        # 強制するCSPはClickjacking対策(frame-ancestors)のみとし、利用者(独自メニュー等)への影響を避ける
        # Keycloak が返すCSPは残す(複数のCSPは両方が適用されるため競合しない)
        # Only frame-ancestors is enforced to avoid impact on users (custom menus etc.)
        # The CSP returned by Keycloak is kept (multiple CSPs are all enforced, so they do not conflict)
        Header always set Content-Security-Policy "frame-ancestors 'self'"

        # 上記以外はReport-Only(ブラウザのコンソールに記録するのみで動作には影響しない)。次版以降で強制するための情報収集用
        # data: は独自メニュー(素材をdata: URLに埋め込みsrcdocのiframeで表示)と fn.base64Decode() の fetch(data:) で必要
        # font-src の blob: はOASEイベントフローのWorkerがCanvas描画用フォントをblob: URLで登録するため必要
        # The rest is Report-Only (logged to the browser console only, no functional impact) to prepare for enforcement in later versions
        # data: is required by custom menus (assets embedded as data: URLs in srcdoc iframe) and fetch(data:) in fn.base64Decode()
        # blob: in font-src is required by the OASE event flow worker, which registers its canvas font via a blob: URL
        Header unset Content-Security-Policy-Report-Only
        Header always set Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' data:; style-src 'self' 'unsafe-inline' data:; img-src 'self' data: blob:; font-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self' data:; frame-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    </If>

    Header unset X-Content-Type-Options
    Header always set X-Content-Type-Options "nosniff"

    Header unset Referrer-Policy
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    Header unset X-XSS-Protection
    Header always set X-XSS-Protection "0"

    # HSTSはHTTPS提供時のみ付与する(HTTPで受け取ったHSTSはブラウザが無視する)。includeSubDomains は他システムへの影響を避けるため付けない
    # HSTS is sent only over HTTPS (browsers ignore it over HTTP). includeSubDomains is omitted to avoid affecting other systems
    Header unset Strict-Transport-Security
    Header always set Strict-Transport-Security "max-age=31536000" "expr=%{HTTPS} == 'on' || req('X-Forwarded-Proto') == 'https'"
</IfModule>

<VirtualHost *:${LISTEN_PORT}>
    AddType  image/x-icon  .ico
    Alias /favicon.ico /app/contents/favicon.ico

    ErrorLogFormat "[%L] %M"
    ErrorLog /dev/stdout

    # Exclude from access log
    SetEnvIf Request_URI "^/health-check/" no_log

    CustomLog /dev/stdout combined env=!no_log
    # TransferLog /dev/stdout
    LogLevel warn
    # クライアントから送られる HTTP リクエストのボディの 総量を制限する(Byte単位)
    # Limit the total amount of HTTP request bodies sent from the client (bytes)
    LimitRequestBody 0

    <IfModule mod_rewrite.c>
        RewriteEngine on
        <IfDefine EXTERNAL_URL>
            RewriteRule ^(/[^/][^/]*/platform)$                    ${EXTERNAL_URL_ORIGIN}$1/ [R]
            RewriteRule ^(/(?!(favicon\.ico$))[^/][^/]*)$          ${EXTERNAL_URL_ORIGIN}$1/platform/ [R]
            RewriteRule ^(/[^/][^/]*)/$                            ${EXTERNAL_URL_ORIGIN}$1/platform/ [R]
        </IfDefine>
        <IfDefine !EXTERNAL_URL>
            RewriteRule ^(/[^/][^/]*/platform)$                    $1/ [R]
            RewriteRule ^(/(?!(favicon.ico$))[^/][^/]*)$           $1/platform/ [R]
            RewriteRule ^(/[^/][^/]*)/$                            $1/platform/ [R]
        </IfDefine>
    </IfModule>

    <IfDefine !MOD_WSGI_DISABLE>
        <Location /api/ >
            ProxyPass !
            ProxyPassReverse !
            Require all granted
        </Location>
    </IfDefine>

    <IfDefine MOD_WSGI_DISABLE>
        <Location /api/ >
            ProxyPass        http://localhost:${FLASK_SERVER_PORT}/api/ retry=0
            ProxyPassReverse http://localhost:${FLASK_SERVER_PORT}/api/
            Require all granted
        </Location>
    </IfDefine>

    #
    # Regulating access to platform,ita administration functions - プラットフォーム・ITA管理機能へのアクセスの規制
    #
    <Location /api/platform/ >
        Require all denied
    </Location>
    <Location /api/ita/ >
        Require all denied
    </Location>
    <Location /api/master/ >
        Require all denied
    </Location>

    #
    # proxy to keycloak
    #
    <Location /auth/ >
        ProxyPass        ${KEYCLOAK_PROTOCOL}://${KEYCLOAK_HOST}:${KEYCLOAK_PORT}/auth/ retry=0
        ProxyPassReverse ${KEYCLOAK_PROTOCOL}://${KEYCLOAK_HOST}:${KEYCLOAK_PORT}/auth/
        Require all granted
        SetEnv force-proxy-request-1.0 1
        SetEnv proxy-nokeepalive 1
        <IfDefine EXTERNAL_URL>
            RequestHeader set X-Forwarded-Host "${EXTERNAL_URL_HOST}"
            RequestHeader set X-Forwarded-Proto "${EXTERNAL_URL_PROTOCOL}"
            RequestHeader set X-Forwarded-Port "${EXTERNAL_URL_PORT}"
        </IfDefine>
    </Location>
    <IfDefine !MOD_WSGI_DISABLE>
        <locationMatch "^/auth/realms/[^/][^/]*/protocol/openid-connect/token$">
            ProxyPass !
            ProxyPassReverse !
            Require all granted
        </locationMatch>
    </IfDefine>
    <IfDefine MOD_WSGI_DISABLE>
        <locationMatch "^/(auth/realms/[^/][^/]*/protocol/openid-connect/token)$">
            ProxyPassMatch http://localhost:${FLASK_SERVER_PORT}/$1
        </locationMatch>
    </IfDefine>

    #
    # Regulating access to Keycloak's Master Realm - keycloak master realmへのアクセスを規制
    #
    <Location /auth/admin/master/ >
        Require all denied
    </Location>
    <Location /auth/admin/realms/master/ >
        Require all denied
    </Location>
    <Location /auth/realms/master/ >
        Require all denied
    </Location>
</VirtualHost>

<VirtualHost *:${LISTEN_PORT_PF_MNG}>
    AddType  image/x-icon  .ico
    Alias /favicon.ico /app/contents/favicon.ico

    ErrorLogFormat "[%L] %M"
    ErrorLog /dev/stdout

    # Exclude from access log
    SetEnvIf Request_URI "^/health-check/" no_log

    CustomLog /dev/stdout combined env=!no_log
    # TransferLog /dev/stdout
    LogLevel warn

    <IfModule mod_rewrite.c>
        RewriteEngine on
        <IfDefine EXTERNAL_URL_MNG>
            RewriteRule ^/auth$  ${EXTERNAL_URL_ORIGIN_MNG}/auth/ [R]
            RewriteRule ^$       ${EXTERNAL_URL_ORIGIN_MNG}/platform/organizations [R]
            RewriteRule ^/$      ${EXTERNAL_URL_ORIGIN_MNG}/platform/organizations [R]
        </IfDefine>
        <IfDefine !EXTERNAL_URL_MNG>
            RewriteRule ^/auth$  /auth/ [R]
            RewriteRule ^$       /platform/organizations [R]
            RewriteRule ^/$      /platform/organizations [R]
        </IfDefine>
    </IfModule>

    #
    # No access except platform,ita - platform,ita以外は、アクセス不可
    #
    <Location /api/ >
        Require all denied
    </Location>

    <IfDefine !MOD_WSGI_DISABLE>
        <Location /api/platform/ >
            ProxyPass !
            ProxyPassReverse !
            Require all granted
        </Location>
        <Location /api/ita/ >
            ProxyPass !
            ProxyPassReverse !
            Require all granted
        </Location>
        <Location /health-check/ >
            ProxyPass !
            ProxyPassReverse !
            Require all granted
        </Location>
    </IfDefine>

    <IfDefine MOD_WSGI_DISABLE>
        <Location /api/platform/ >
            ProxyPass        http://localhost:${FLASK_SERVER_PORT}/api/platform/ retry=0
            ProxyPassReverse http://localhost:${FLASK_SERVER_PORT}/api/platform/
            Require all granted
        </Location>
        <Location /api/ita/ >
            ProxyPass        http://localhost:${FLASK_SERVER_PORT}/api/ita/ retry=0
            ProxyPassReverse http://localhost:${FLASK_SERVER_PORT}/api/ita/
            Require all granted
        </Location>
        <Location /health-check/ >
            ProxyPass        http://localhost:${FLASK_SERVER_PORT}/health-check/ retry=0
            ProxyPassReverse http://localhost:${FLASK_SERVER_PORT}/health-check/
            Require all granted
        </Location>
    </IfDefine>

    #
    # proxy to keycloak
    #
    <Location /auth/ >
        ProxyPass        ${KEYCLOAK_PROTOCOL}://${KEYCLOAK_HOST}:${KEYCLOAK_PORT}/auth/ retry=0
        ProxyPassReverse ${KEYCLOAK_PROTOCOL}://${KEYCLOAK_HOST}:${KEYCLOAK_PORT}/auth/
        Require all granted
        SetEnv force-proxy-request-1.0 1
        SetEnv proxy-nokeepalive 1
        <IfDefine EXTERNAL_URL_MNG>
            RequestHeader set X-Forwarded-Host "${EXTERNAL_URL_HOST_MNG}"
            RequestHeader set X-Forwarded-Proto "${EXTERNAL_URL_PROTOCOL_MNG}"
            RequestHeader set X-Forwarded-Port "${EXTERNAL_URL_PORT_MNG}"
        </IfDefine>
    </Location>
    <IfDefine !MOD_WSGI_DISABLE>
        <locationMatch "^/auth/realms/master/protocol/openid-connect/token$">
            ProxyPass !
            ProxyPassReverse !
            Require all granted
        </locationMatch>
    </IfDefine>
    <IfDefine MOD_WSGI_DISABLE>
        <locationMatch "^/(auth/realms/master/protocol/openid-connect/token)$">
            ProxyPassMatch http://localhost:${FLASK_SERVER_PORT}/$1
        </locationMatch>
    </IfDefine>

    # オーガナイゼーションユーザー用のパスをブロックする
    # Block paths for organization users
    <locationMatch "^/auth/realms(?!(/master/))/[^/][^/]*/protocol/openid-connect/token$">
        Require all denied
    </locationMatch>
    <locationMatch "^/(?!(master/))(?!(api/))(?!(auth/))(?!(platform/))(?!(health-check/))(?!(_/))(?!(favicon\.ico$))">
       Require all denied
    </locationMatch>

    <Location /platform/ >
        ProxyPass        ${PLATFORM_WEB_PROTOCOL}://${PLATFORM_WEB_HOST}:${PLATFORM_WEB_PORT}/platform/ retry=0
        ProxyPassReverse ${PLATFORM_WEB_PROTOCOL}://${PLATFORM_WEB_HOST}:${PLATFORM_WEB_PORT}/platform/
        Require all granted
    </Location>
</VirtualHost>
