get:
  tags:
    - UsersService
  summary: Credential詳細を取得
  description: 特定のCredential詳細を取得する(Credentialデータはマスクされる)
  operationId: get_credential
  x-openapi-router-controller: controllers.users_service_controller
  parameters:
    - name: organization_id
      in: path
      required: true
      schema:
        type: string
    - name: ai_service_id
      in: path
      required: true
      schema:
        type: string
        enum: [bedrock-cache, bedrock]
    - name: credential_id
      in: path
      required: true
      schema:
        type: string
  responses:
    200:
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../schemas/responseOk.yaml'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      credential_id:
                        type: string
                      ai_service_id:
                        type: string
                      credential_name:
                        type: string
                      status:
                        type: string
                      expires_at:
                        type: string
                        format: date-time
                      last_used_at:
                        type: string
                        format: date-time
                      credential_data_keys:
                        type: array
                        items:
                          type: string
                        description: Credentialデータに含まれるキー一覧
    404:
      description: Credentialが見つからない
      content:
        application/json:
          schema:
            $ref: '../schemas/runtimeError.yaml'
    default:
      description: An unexpected error response.
      content:
        application/json:
          schema:
            $ref: '../schemas/runtimeError.yaml'

patch:
  tags:
    - UsersService
  summary: Credentialを更新
  description: 既存のCredentialを部分更新する(指定されたフィールドのみ更新)
  operationId: update_credential
  x-openapi-router-controller: controllers.users_service_controller
  parameters:
    - name: organization_id
      in: path
      required: true
      schema:
        type: string
    - name: ai_service_id
      in: path
      required: true
      schema:
        type: string
        enum: [bedrock-cache, bedrock]
    - name: credential_id
      in: path
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            credential_name:
              type: string
              description: Credential名(任意)
            credential_data:
              type: object
              description: Credentialデータ(任意)
            notes:
              type: string
              description: 備考(任意)
        examples:
          update_cache:
            summary: キャッシュファイルを更新
            value:
              credential_data:
                accessToken:
                  accessKeyId: "ASIA..."
                  secretAccessKey: "..."
                  sessionToken: "..."
                  expiresAt: "2026-08-19T12:00:00Z"
                refreshToken: "..."
                idToken: "..."
          update_name:
            summary: Credential名だけ更新
            value:
              credential_name: "新しい名前"
  responses:
    200:
      description: 更新成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../schemas/responseOk.yaml'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      credential_id:
                        type: string
                      ai_service_id:
                        type: string
                      credential_name:
                        type: string
                      status:
                        type: string
                      message:
                        type: string
    400:
      description: バリデーションエラー
      content:
        application/json:
          schema:
            $ref: '../schemas/runtimeError.yaml'
    404:
      description: Credentialが見つからない
      content:
        application/json:
          schema:
            $ref: '../schemas/runtimeError.yaml'
    default:
      description: An unexpected error response.
      content:
        application/json:
          schema:
            $ref: '../schemas/runtimeError.yaml'

delete:
  tags:
    - UsersService
  summary: Credentialを削除
  description: Credentialを削除する
  operationId: delete_credential
  x-openapi-router-controller: controllers.users_service_controller
  parameters:
    - name: organization_id
      in: path
      required: true
      schema:
        type: string
    - name: ai_service_id
      in: path
      required: true
      schema:
        type: string
        enum: [bedrock-cache, bedrock]
    - name: credential_id
      in: path
      required: true
      schema:
        type: string
  responses:
    200:
      description: 削除成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../schemas/responseOk.yaml'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      credential_id:
                        type: string
                      message:
                        type: string
    404:
      description: Credentialが見つからない
      content:
        application/json:
          schema:
            $ref: '../schemas/runtimeError.yaml'
    default:
      description: An unexpected error response.
      content:
        application/json:
          schema:
            $ref: '../schemas/runtimeError.yaml'
