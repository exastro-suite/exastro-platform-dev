post:
  tags:
    - AIAssistantService
  summary: AI応答を生成
  description: >-
    ユーザーメッセージを送信し、AIとの会話を1ターン進めて応答を取得する。
    会話全体はT_CHAT_HISTORYにJSON配列(ターン一覧)のスナップショットとして保存される(T_CHAT_MESSAGEは使用しない)。
  operationId: create_completion
  x-openapi-router-controller: controllers.ai_assistant_service_controller
  parameters:
    - name: organization_id
      in: path
      required: true
      schema:
        type: string
    - name: workspace_id
      in: path
      required: true
      schema:
        type: string
    - name: conversation_id
      in: path
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - message
          properties:
            message:
              type: string
              description: ユーザーメッセージ
              example: "こんにちは、Bedrockのテストです"
            ai_service_id:
              type: string
              description: AIサービスID(メッセージ固有、会話のデフォルトをオーバーライド、省略時は会話のAI_SERVICE_IDを使用)
              enum: [bedrock-cache, bedrock, openai, anthropic]
              example: "bedrock-cache"
            model_id:
              type: string
              description: 使用するモデルID(メッセージごとに変更可能、省略時はデフォルト)
              example: "anthropic.claude-3-5-sonnet-20240620-v1:0"
            menu_id:
              type: string
              description: ITA画面ID(指定時はメニュー固有のシステムプロンプトを追加)
              example: "menu_001"
  responses:
    200:
      description: AI応答の生成成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../schemas/responseOk.yaml'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      conversation_id:
                        type: string
                      history_id:
                        type: string
                        description: 保存されたT_CHAT_HISTORYスナップショットのID
                      user_message_seq:
                        type: integer
                        description: スナップショット内でのユーザーメッセージの順序番号(1始まり)
                      assistant_message_seq:
                        type: integer
                        description: スナップショット内でのアシスタントメッセージの順序番号(1始まり)
                      content:
                        type: string
                        description: AIの応答
                      usage:
                        type: object
                        properties:
                          input_tokens:
                            type: integer
                          output_tokens:
                            type: integer
                          total_tokens:
                            type: integer
    400:
      description: バリデーションエラー
      content:
        application/json:
          schema:
            $ref: '../schemas/runtimeError.yaml'
    404:
      description: 会話が見つからない
      content:
        application/json:
          schema:
            $ref: '../schemas/runtimeError.yaml'
    500:
      description: サーバーエラー
      content:
        application/json:
          schema:
            $ref: '../schemas/runtimeError.yaml'
