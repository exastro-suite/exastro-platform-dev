get:
  tags:
    - UsersService
  summary: |-
    AI利用設定を取得
    Get the AI preference
  description: |-
    ユーザーのAI利用設定(デフォルトAIサービス、デフォルトモデル、ピックアップモデル一覧)を取得する。一度も保存していない場合は全項目nullまたは空配列で返す。
    Get the user's AI preference (default AI service, default model, list of picked-up models). If nothing has been saved yet, all fields are returned as null or an empty array.
  operationId: get_ai_preference
  x-openapi-router-controller: controllers.users_service_controller
  parameters:
    - name: organization_id
      in: path
      required: true
      schema:
        type: string
  responses:
    200:
      description: |-
        成功
        Success
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../schemas/responseOk.yaml'
              - type: object
                properties:
                  data:
                    $ref: '../schemas/aiPreferenceInfo.yaml'
    500:
      description: |-
        サーバーエラー
        Server error
      content:
        application/json:
          schema:
            $ref: '../schemas/runtimeError.yaml'

put:
  tags:
    - UsersService
  summary: |-
    AI利用設定を保存
    Save the AI preference
  description: |-
    ユーザーのAI利用設定を全置換で保存する。ai_service_id/model_idは必須で、指定した内容にそのまま置き換わる（部分更新ではない）。
    Save the user's AI preference as a full replacement. ai_service_id/model_id are required, and the stored content is entirely replaced with what is specified (not a partial update).
  operationId: update_ai_preference
  x-openapi-router-controller: controllers.users_service_controller
  parameters:
    - name: organization_id
      in: path
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - ai_service_id
            - model_id
          properties:
            ai_service_id:
              type: string
              description: |-
                デフォルトで使用するAIサービスID
                Default AI service ID to use
              enum: [bedrock-cache, bedrock, openai, anthropic]
              example: "bedrock-cache"
            model_id:
              type: string
              description: |-
                デフォルトで使用するモデルID
                Default model ID to use
              example: "anthropic.claude-3-5-sonnet-20240620-v1:0"
            pickup_model_ids:
              type: array
              description: |-
                UIでモデル選択の候補を絞り込むためにピックアップしたモデルID一覧(省略時は空配列)
                List of model IDs picked to narrow down the model choices shown in the UI (empty array if omitted)
              items:
                type: string
              example:
                - "anthropic.claude-3-5-sonnet-20240620-v1:0"
                - "global.anthropic.claude-sonnet-5"
  responses:
    200:
      description: |-
        保存成功
        Saved successfully
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../schemas/responseOk.yaml'
              - type: object
                properties:
                  data:
                    $ref: '../schemas/aiPreferenceInfo.yaml'
    400:
      description: |-
        バリデーションエラー
        Validation error
      content:
        application/json:
          schema:
            $ref: '../schemas/runtimeError.yaml'
    500:
      description: |-
        サーバーエラー
        Server error
      content:
        application/json:
          schema:
            $ref: '../schemas/runtimeError.yaml'
