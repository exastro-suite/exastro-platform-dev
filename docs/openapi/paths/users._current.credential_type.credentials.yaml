post:
  tags:
    - UsersService
  summary: Credentialを登録
  description: 外部サービスのCredentialを登録する
  operationId: register_credential
  x-openapi-router-controller: controllers.users_service_controller
  parameters:
    - name: organization_id
      in: path
      required: true
      schema:
        type: string
    - name: credential_type
      in: path
      required: true
      schema:
        type: string
        enum: [bedrock-cache, bedrock, openai, anthropic]
      description: |
        Credentialタイプ
        - bedrock-cache: AWS Login Cache (自動トークン更新、credential_data: {"enabled": true})
        - bedrock: AWS Bedrock (手動Credential登録)
        - openai: OpenAI API
        - anthropic: Anthropic API
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - credential_name
            - credential_data
          properties:
            credential_name:
              type: string
              description: Credential名
              example: "My Bedrock Credential"
            credential_data:
              type: object
              description: |
                Credentialデータ(JSON形式、サービスごとに異なる)

                bedrock-cache の例:
                  {"enabled": true}

                bedrock の例:
                  {
                    "access_key_id": "ASIA...",
                    "secret_access_key": "...",
                    "session_token": "...",
                    "region": "ap-northeast-1",
                    "expires_at": "2026-08-17T15:00:00Z"
                  }
              example:
                enabled: true
            notes:
              type: string
              description: 備考
  responses:
    200:
      description: 登録成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../schemas/responseOk.yaml'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      credential_id:
                        type: string
                      credential_type:
                        type: string
                      credential_name:
                        type: string
                      status:
                        type: string
                      message:
                        type: string
    400:
      description: バリデーションエラー
      content:
        application/json:
          schema:
            $ref: '../schemas/runtimeError.yaml'
    500:
      description: サーバーエラー
      content:
        application/json:
          schema:
            $ref: '../schemas/runtimeError.yaml'

get:
  tags:
    - UsersService
  summary: Credential一覧を取得
  description: ユーザーのCredential一覧を取得する
  operationId: list_credentials
  x-openapi-router-controller: controllers.users_service_controller
  parameters:
    - name: organization_id
      in: path
      required: true
      schema:
        type: string
    - name: credential_type
      in: path
      required: true
      schema:
        type: string
        enum: [bedrock-cache, bedrock]
    - name: status
      in: query
      required: false
      schema:
        type: string
        enum: [active, expired, disabled]
      description: ステータスフィルター
  responses:
    200:
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../schemas/responseOk.yaml'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      credentials:
                        type: array
                        items:
                          $ref: '../schemas/aiCredentialInfo.yaml'
                      count:
                        type: integer
                      credential_type:
                        type: string
    default:
      description: An unexpected error response.
      content:
        application/json:
          schema:
            $ref: '../schemas/runtimeError.yaml'
