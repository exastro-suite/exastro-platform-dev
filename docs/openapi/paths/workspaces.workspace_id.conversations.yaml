post:
  tags:
    - AIAssistantService
  summary: 会話を作成
  description: 新しいチャット会話を作成する
  operationId: create_conversation
  x-openapi-router-controller: controllers.ai_assistant_service_controller
  parameters:
    - name: organization_id
      in: path
      required: true
      schema:
        type: string
    - name: workspace_id
      in: path
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - title
          properties:
            title:
              type: string
              description: 会話タイトル
              example: "Bedrockとのチャット"
            service_id:
              type: string
              description: サービスID（システムプロンプト切り替え用）
              default: "LLMEditor"
              enum:
                - LLMEditor
                - AgenticAI
              example: "LLMEditor"
  responses:
    200:
      description: 会話作成成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../schemas/responseOk.yaml'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      conversation_id:
                        type: string
                      service_id:
                        type: string
                        description: サービスID
                      ai_service_id:
                        type: string
                        description: AIサービスID（ユーザーのCredentialから自動取得）
                      title:
                        type: string
                      status:
                        type: string
    400:
      description: バリデーションエラー
      content:
        application/json:
          schema:
            $ref: '../schemas/runtimeError.yaml'
    500:
      description: サーバーエラー
      content:
        application/json:
          schema:
            $ref: '../schemas/runtimeError.yaml'

get:
  tags:
    - AIAssistantService
  summary: 会話一覧を取得
  description: ユーザーの会話一覧を取得する
  operationId: list_conversations
  x-openapi-router-controller: controllers.ai_assistant_service_controller
  parameters:
    - name: organization_id
      in: path
      required: true
      schema:
        type: string
    - name: workspace_id
      in: path
      required: true
      schema:
        type: string
    - name: status
      in: query
      required: false
      schema:
        type: string
        enum: [active, closed, archived]
      description: ステータスフィルター
    - name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 50
      description: 取得件数
    - name: offset
      in: query
      required: false
      schema:
        type: integer
        default: 0
      description: オフセット
  responses:
    200:
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../schemas/responseOk.yaml'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      conversations:
                        type: array
                        items:
                          $ref: '../schemas/conversationInfo.yaml'
                      count:
                        type: integer
                      total_count:
                        type: integer
    default:
      description: An unexpected error response.
      content:
        application/json:
          schema:
            $ref: '../schemas/runtimeError.yaml'
