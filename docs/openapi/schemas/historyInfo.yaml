type: object
properties:
  history_id:
    type: string
    description: 履歴ID
  conversation_id:
    type: string
    description: 会話ID
  history_seq:
    type: integer
    description: 履歴順序番号
  contents:
    type: array
    description: 会話履歴JSON配列（各要素にrole, content, _timestamp等を含む）
    items:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: array
          items:
            type: object
        _timestamp:
          type: string
          format: date-time
        _thinkingMs:
          type: integer
        _model:
          type: string
  created_at:
    type: string
    format: date-time
    description: 作成日時
  updated_at:
    type: string
    format: date-time
    description: 最終更新日時
