type: object
properties:
  history_id:
    type: string
    description: 履歴ID
  conversation_id:
    type: string
    description: 会話ID
  history_seq:
    type: integer
    description: 履歴順序番号
  role:
    type: string
    enum: [user, assistant]
    description: ロール
  content:
    type: array
    description: コンテンツ（JSON配列）
    items:
      type: object
  _timestamp:
    type: string
    format: date-time
    description: タイムスタンプ
  _thinkingMs:
    type: integer
    description: 思考時間（ミリ秒、assistantの場合のみ）
  _model:
    type: string
    description: モデル名（assistantの場合のみ）
